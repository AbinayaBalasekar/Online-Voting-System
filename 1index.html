!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digital Complaint Redressal System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 class="text-center mb-4">Digital Complaint Redressal System</h2>

    <!-- Complaint Form -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">Submit Complaint</div>
        <div class="card-body">
            <form id="complaintForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="name" class="form-control" placeholder="Your Name" required>+
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="department" class="form-control" placeholder="Department" required>
                    </div>
                    <div class="col-md-4">
                        <input type="date" id="date" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <textarea id="complaint" class="form-control" placeholder="Complaint Details" required></textarea>
                    </div>
                    <div class="col-12 text-end">
                        <button class="btn btn-success">Submit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="row mb-4 text-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Total</h5>
                    <h3 id="totalCount">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Pending</h5>
                    <h3 id="pendingCount">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Resolved</h5>
                    <h3 id="resolvedCount">0</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Complaint Table -->
    <div class="card">
        <div class="card-header bg-dark text-white">Complaint List</div>
        <div class="card-body table-responsive">
            <table class="table table-bordered">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Date</th>
                        <th>Complaint</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="complaintTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
